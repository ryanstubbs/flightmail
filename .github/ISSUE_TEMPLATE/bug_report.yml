name: Bug Report
description: Report something broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill out the sections below so we can reproduce and fix it faster.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what went wrong.
      placeholder: Sending fails with an SMTP timeout when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal, numbered steps starting from a fresh state.
      placeholder: |
        1. Run `flightmail send --to x@y.z`
        2. Attach file larger than 10MB
        3. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include full error messages or stack traces.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Version of flightmail (output of `flightmail --version` or git commit SHA)
      placeholder: v1.2.3
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How Often Does This Happen?
      options:
        - Always
        - Sometimes
        - Once
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How badly does this affect you?
      options:
        - Critical - blocks all work, no workaround
        - High - major feature unusable
        - Medium - workaround exists
        - Low - cosmetic or minor annoyance
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Output
      description: Redact any secrets, tokens, or personal data first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before Submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true
        - label: I redacted secrets/tokens/personal data from logs
          required: true
        - label: I can reproduce this on the latest version
